<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="amber" x1="87" y1="133" x2="169" y2="183" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>
    <filter id="sh" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#0B1230" flood-opacity="0.28"/>
    </filter>
    <clipPath id="cardClip">
      <rect x="40" y="58" width="176" height="166" rx="24"/>
    </clipPath>
  </defs>

  <!-- tile -->
  <rect width="256" height="256" rx="58" fill="url(#bg)"/>

  <!-- ring binders (behind the card) -->
  <rect x="74" y="44" width="14" height="34" rx="7" fill="#1E1B4B"/>
  <rect x="168" y="44" width="14" height="34" rx="7" fill="#1E1B4B"/>

  <!-- calendar card -->
  <g filter="url(#sh)">
    <rect x="40" y="58" width="176" height="166" rx="24" fill="#FFFFFF"/>
  </g>
  <g clip-path="url(#cardClip)">
    <rect x="40" y="58" width="176" height="40" fill="#E0E7FF"/>
  </g>

  <!-- header ticks -->
  <rect x="64" y="74" width="26" height="8" rx="4" fill="#A5B4FC"/>
  <rect x="166" y="74" width="26" height="8" rx="4" fill="#A5B4FC"/>

  <!-- date grid: 5 x 4 rounded squares -->
  <g fill="#CBD5E1">
    <rect x="56"  y="104.5" width="20" height="20" rx="5"/>
    <rect x="87"  y="104.5" width="20" height="20" rx="5"/>
    <rect x="118" y="104.5" width="20" height="20" rx="5"/>
    <rect x="149" y="104.5" width="20" height="20" rx="5"/>
    <rect x="180" y="104.5" width="20" height="20" rx="5"/>

    <rect x="56"  y="133.5" width="20" height="20" rx="5"/>
    <rect x="180" y="133.5" width="20" height="20" rx="5"/>

    <rect x="56"  y="162.5" width="20" height="20" rx="5"/>
    <rect x="180" y="162.5" width="20" height="20" rx="5"/>

    <rect x="56"  y="191.5" width="20" height="20" rx="5"/>
    <rect x="87"  y="191.5" width="20" height="20" rx="5"/>
    <rect x="118" y="191.5" width="20" height="20" rx="5"/>
    <rect x="149" y="191.5" width="20" height="20" rx="5"/>
    <rect x="180" y="191.5" width="20" height="20" rx="5"/>
  </g>

  <!-- highlighted date range: soft bridge + solid cells -->
  <rect x="81" y="127.5" width="94" height="61" rx="12" fill="#F59E0B" fill-opacity="0.22"/>
  <g fill="url(#amber)">
    <rect x="87"  y="133.5" width="20" height="20" rx="5"/>
    <rect x="118" y="133.5" width="20" height="20" rx="5"/>
    <rect x="149" y="133.5" width="20" height="20" rx="5"/>
    <rect x="87"  y="162.5" width="20" height="20" rx="5"/>
    <rect x="118" y="162.5" width="20" height="20" rx="5"/>
    <rect x="149" y="162.5" width="20" height="20" rx="5"/>
  </g>
</svg>
